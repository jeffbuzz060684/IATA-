<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Assistant IATA — Marchandises Dangereuses</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>html,body{margin:0;background:#0b1220;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif}#st{padding:28px 16px;text-align:center;font-size:1.05rem;line-height:1.5}</style>
</head>
<body>
<div id="st">⏳ Mise à jour de l'application (v11)…<br><span style="font-size:.85rem;opacity:.7">Ne ferme pas la page — elle se recharge automatiquement.</span></div>
<script>
(function(){
  var st = document.getElementById("st");
  var tries = 0;
  try { tries = parseInt(sessionStorage.getItem("v11b-tries") || "0", 10) || 0; } catch(e){}
  function save(n){ try { sessionStorage.setItem("v11b-tries", String(n)); } catch(e){} }
  function fail(m){ st.innerHTML = "⚠️ Mise à jour impossible : " + m + "<br>Vérifie ta connexion puis <b>recharge la page</b>."; }
  if (!("serviceWorker" in navigator)) { fail("navigateur sans service worker."); return; }
  var reloaded = false;
  function reloadNow(reset){ if (reloaded) return; reloaded = true; save(reset ? 0 : tries + 1); location.reload(); }
  navigator.serviceWorker.addEventListener("controllerchange", function(){ reloadNow(true); });
  navigator.serviceWorker.register("./sw.js").then(function(){
    if (tries >= 3) { fail("l'application n'arrive pas à démarrer malgré la mise à jour — signale-le avec une capture d'écran."); return; }
    var wait = tries === 0 ? 6000 : 12000;
    setTimeout(function(){ if (!reloaded) reloadNow(false); }, wait);
  }).catch(function(e){ fail("installation du service worker (" + (e && e.message ? e.message : e) + ")"); });
})();
</script>
</body>
</html>
